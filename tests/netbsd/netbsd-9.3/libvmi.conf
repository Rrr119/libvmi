# LibVMI configuration for the NetBSD 9.3 amd64 test image.
# Point LIBVMI_NETBSD_IMAGE at the memory dump (see run_netbsd_tests.sh).
netbsd-9.3 {
    ostype        = "NetBSD";
    sysmap        = "tests/netbsd/netbsd-9.3/System.map";
    netbsd_pid     = 0x70;
    netbsd_name    = 0x26c;
    netbsd_vmspace = 0xb0;
    netbsd_pmap    = 0x40;
    netbsd_pgd     = 0x28;
}
