# LibVMI configuration for the NetBSD 10.99 (-current) amd64 test image.
# Point LIBVMI_NETBSD_IMAGE at the memory dump (see run_netbsd_tests.sh).
netbsd-10.99 {
    ostype        = "NetBSD";
    sysmap        = "tests/netbsd/netbsd-10.99/System.map";
    netbsd_pid     = 0x80;
    netbsd_name    = 0x27c;
    netbsd_vmspace = 0xc0;
    netbsd_pmap    = 0x50;
    netbsd_pgd     = 0x30;
}
