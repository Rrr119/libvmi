# LibVMI configuration for the NetBSD 10.1 amd64 test image.
# Point LIBVMI_NETBSD_IMAGE at the memory dump (see run_netbsd_tests.sh).
netbsd-10.1 {
    ostype        = "NetBSD";
    sysmap        = "tests/netbsd/netbsd-10.1/System.map";
    netbsd_pid     = 0x78;
    netbsd_name    = 0x274;
    netbsd_vmspace = 0xb8;
    netbsd_pmap    = 0x48;
    netbsd_pgd     = 0x28;
}
